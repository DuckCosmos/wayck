name: Attach installer to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.7)"
        required: true
        default: "v0.1.7"

permissions:
  contents: write

jobs:
  attach-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Attach install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" install.sh --clobber
