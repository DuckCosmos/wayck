name: Go backend build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Go backend
        run: cd src && go build -trimpath -ldflags='-s -w' -o ../publish/wayck-backend .
      - name: Smoke test launcher JSON and calculator
        run: |
          ./publish/wayck-backend --filter "1 + 1" > launcher.json
          python3 - <<'PY'
          import json
          data = json.load(open("launcher.json"))
          assert isinstance(data, list) and data, data
          assert data[0]["nome"] == "1 + 1 = 2", data[0]
          assert data[0]["exec"] == "@copy:2", data[0]
          assert "icone_path" in data[0], data[0]
          print("Launcher JSON and calculator passed")
          PY
      - name: Smoke test monitor JSON
        run: |
          timeout 2s ./publish/wayck-backend --monitor > monitor.jsonl || test $? -eq 124
          python3 - <<'PY'
          import json
          with open("monitor.jsonl") as f:
              data = json.loads(next(f))
          required = {"cpu_percent", "ram_percent", "disk_percent", "gpu_available", "network_down_kib_s", "network_up_kib_s"}
          assert required <= data.keys(), data
          print("Monitor JSON passed")
          PY
      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: wayck-backend-linux-x64
          path: publish/wayck-backend
