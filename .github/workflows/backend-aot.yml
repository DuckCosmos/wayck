name: Backend AOT build

on:
  push:
    branches:
      - main
      - csharp-native-aot-migration
  pull_request:

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish Native AOT backend
        run: dotnet publish src/Wayck.Backend.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:StripSymbols=true -o publish
      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: wayck-backend-linux-x64
          path: publish/wayck-backend
