[package]
name = "wayck-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "6"
libc = "0.2"
meval = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
tempfile = "3"
